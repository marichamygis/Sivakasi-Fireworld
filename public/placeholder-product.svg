<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="160" height="160" fill="url(#bgGrad)" rx="16" />
  
  <!-- Subtle circular halo -->
  <circle cx="80" cy="74" r="42" fill="#fde68a" opacity="0.45" />

  <!-- Sparkles / bursts -->
  <path d="M80 32 L82 44 L94 46 L82 48 L80 60 L78 48 L66 46 L78 44 Z" fill="url(#goldGrad)" />
  <circle cx="58" cy="54" r="3" fill="#f59e0b" />
  <circle cx="102" cy="54" r="3" fill="#f59e0b" />
  <circle cx="50" cy="80" r="2.5" fill="#ef4444" />
  <circle cx="110" cy="80" r="2.5" fill="#ef4444" />
  <circle cx="98" cy="98" r="2" fill="#d97706" />

  <!-- Rocket Body -->
  <g transform="translate(80, 80) rotate(-45) translate(-80, -80)">
    <!-- Stick -->
    <rect x="78" y="70" width="4" height="42" fill="#78350f" rx="1.5" />
    <!-- Fins -->
    <path d="M72 78 L80 68 L88 78 Z" fill="#b91c1c" />
    <!-- Cylinder -->
    <rect x="74" y="50" width="12" height="24" rx="2" fill="url(#rocketGrad)" />
    <!-- Stripes -->
    <rect x="74" y="55" width="12" height="4" fill="#fbbf24" />
    <rect x="74" y="63" width="12" height="4" fill="#fbbf24" />
    <!-- Cone Tip -->
    <path d="M80 38 L88 50 L72 50 Z" fill="#991b1b" />
  </g>

  <!-- Cracker / Fireworks label -->
  <text x="80" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#92400e" text-anchor="middle" letter-spacing="0.5">SIVAKASI CRACKERS</text>
</svg>
